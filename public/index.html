<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BAJA CASINO | 3D VIP Lounge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { overflow: hidden; background: #05050a; font-family: system-ui, -apple-system, sans-serif; color: #fff; }

    #hud {
      position: fixed; top: 0; left: 0; width: 100%; padding: 12px 14px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      background: linear-gradient(180deg, rgba(5,5,12,0.92) 0%, rgba(5,5,12,0.4) 70%, transparent 100%);
      z-index: 20; pointer-events: none;
    }
    .badge {
      background: rgba(16, 18, 30, 0.88); backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.7);
      padding: 8px 13px; border-radius: 999px; font-weight: 800; font-size: 13px;
      letter-spacing: 0.4px; box-shadow: 0 0 18px rgba(212, 175, 55, 0.25);
      pointer-events: auto;
    }
    .brand { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.45); }

    #modeBar {
      position: fixed; top: 56px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 20;
      background: rgba(12, 14, 24, 0.85); padding: 5px; border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(8px);
    }
    .mode-btn {
      background: transparent; color: #b8bfd6; border: none; padding: 6px 14px;
      border-radius: 999px; font-weight: 700; font-size: 12px; cursor: pointer;
    }
    .mode-btn.active {
      background: linear-gradient(135deg, #d4af37, #ff9d00);
      color: #08080f; box-shadow: 0 0 14px rgba(255, 180, 0, 0.45);
    }

    #status {
      position: fixed; top: 98px; left: 50%; transform: translateX(-50%);
      font-size: 13px; font-weight: 700; color: #ffe57f; z-index: 20;
      text-shadow: 0 2px 10px rgba(0,0,0,0.95); text-align: center; width: 92%;
      pointer-events: none;
    }

    #panel {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      width: min(94vw, 460px); z-index: 20;
      background: rgba(11, 13, 23, 0.9); backdrop-filter: blur(12px);
      padding: 12px; border-radius: 18px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.75);
    }

    #betSizes {
      display: flex; justify-content: space-between; gap: 6px; margin-bottom: 10px;
    }
    .chip-btn {
      flex: 1; padding: 6px 0; border-radius: 10px; font-size: 12px; font-weight: 800;
      background: rgba(255,255,255,0.06); color: #cbd2e8; border: 1px solid rgba(255,255,255,0.12);
      cursor: pointer;
    }
    .chip-btn.active {
      background: rgba(212, 175, 55, 0.22); color: #ffd700; border-color: #ffd700;
    }

    .action-row { display: flex; gap: 8px; }
    .game-btn {
      flex: 1; border: none; padding: 12px 10px; border-radius: 12px; font-weight: 800;
      color: #fff; cursor: pointer; font-size: 12px; letter-spacing: 0.3px;
      transition: transform 0.1s ease, filter 0.15s ease;
    }
    .game-btn:active { transform: scale(0.96); }
    .game-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-red { background: linear-gradient(180deg, #ff334b, #b81427); box-shadow: 0 4px 16px rgba(255, 51, 75, 0.35); }
    .btn-green { background: linear-gradient(180deg, #1de076, #0d8242); box-shadow: 0 4px 16px rgba(29, 224, 118, 0.35); }
    .btn-black { background: linear-gradient(180deg, #2d3246, #141722); border: 1px solid rgba(255,255,255,0.18); }
    .btn-launch { background: linear-gradient(135deg, #ff7b00, #ff006e); box-shadow: 0 4px 20px rgba(255, 60, 110, 0.45); }

    .hidden { display: none !important; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <div class="badge"><span class="brand">◆ BAJA CASINO</span> VIP 3D</div>
    <div class="badge">💰 <span id="chips">1000</span></div>
  </div>

  <div id="modeBar">
    <button id="tabRoulette" class="mode-btn active" onclick="switchGame('roulette')">ROULETTE 3D</button>
    <button id="tabRocket" class="mode-btn" onclick="switchGame('rocket')">RISING ROCKETS</button>
  </div>

  <div id="status">Select chip size &amp; place your bet</div>

  <div id="panel">
    <div id="betSizes">
      <button class="chip-btn" onclick="setBet(50, this)">50</button>
      <button class="chip-btn active" onclick="setBet(100, this)">100</button>
      <button class="chip-btn" onclick="setBet(250, this)">250</button>
      <button class="chip-btn" onclick="setBet(500, this)">500</button>
    </div>

    <div id="rouletteControls" class="action-row">
      <button class="game-btn btn-red" onclick="placeBet('red')">RED 2x</button>
      <button class="game-btn btn-green" onclick="placeBet('green')">ZERO 14x</button>
      <button class="game-btn btn-black" onclick="placeBet('black')">BLACK 2x</button>
    </div>

    <div id="rocketControls" class="action-row hidden">
      <button class="game-btn btn-launch" onclick="launchRocket(1.5)">TARGET 1.5x</button>
      <button class="game-btn btn-launch" onclick="launchRocket(2.5)">TARGET 2.5x</button>
      <button class="game-btn btn-launch" onclick="launchRocket(5.0)">TARGET 5.0x</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/main3d.js"></script>
</body>
</html>
