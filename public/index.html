<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Baja Casino | 3D Lounge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; background: #07070d; font-family: system-ui, -apple-system, sans-serif; color: #fff; }
    #hud {
      position: fixed; top: 0; left: 0; width: 100%; padding: 14px 18px;
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
      z-index: 10; pointer-events: none;
    }
    .badge {
      background: rgba(20, 22, 35, 0.92); border: 1px solid #d4af37;
      padding: 8px 14px; border-radius: 20px; font-weight: 700; font-size: 14px;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.25);
    }
    #status {
      position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
      font-size: 14px; font-weight: 600; color: #ffd700; z-index: 10;
      text-shadow: 0 2px 8px #000; white-space: nowrap;
    }
    #controls {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 10; background: rgba(12, 14, 24, 0.92);
      padding: 12px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.15);
    }
    button {
      border: none; padding: 12px 16px; border-radius: 10px; font-weight: 700;
      color: #fff; cursor: pointer; font-size: 13px;
    }
    .btn-red { background: #d92638; }
    .btn-green { background: #149e53; }
    .btn-black { background: #222634; border: 1px solid #555; }
    button:disabled { opacity: 0.4; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <div class="badge">🎰 BAJA CASINO 3D</div>
    <div class="badge">💰 <span id="chips">1000</span></div>
  </div>
  <div id="status">Tap a color to spin (100 Chips)</div>
  <div id="controls">
    <button class="btn-red" onclick="placeBet('red')">RED 2x</button>
    <button class="btn-green" onclick="placeBet('green')">ZERO 14x</button>
    <button class="btn-black" onclick="placeBet('black')">BLACK 2x</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/main3d.js"></script>
</body>
</html>
